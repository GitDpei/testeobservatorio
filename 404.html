<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | Observatório Municipal de Porto Velho</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #f3f4ff; text-align: center;
      background: radial-gradient(60vmax 45vmax at 0% 0%, rgba(59,63,158,.55), transparent 62%),
                  radial-gradient(55vmax 45vmax at 100% 100%, rgba(235,133,13,.2), transparent 62%), #04032c;
    }
    main { max-width: 460px; }
    h1 { font-size: 26px; margin: 12px 0 8px; }
    p { color: rgba(232,234,255,.76); line-height: 1.6; }
    .codigo { font-size: 84px; font-weight: 800; letter-spacing: -.04em; margin: 0; line-height: 1; }
    a { display: inline-block; margin-top: 16px; padding: 14px 24px; border-radius: 999px; background: #f7a534; color: #04032c; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="codigo" aria-hidden="true">404</p>
    <h1>Página não encontrada</h1>
    <p>Este endereço não existe no Observatório. Você será levado à página inicial em alguns segundos.</p>
    <a id="inicio" href="/">Ir para a página inicial</a>
  </main>
  <script>
    // Em sites de projeto do GitHub Pages (usuario.github.io/repositorio/), a raiz é a 1ª pasta.
    (function () {
      var partes = location.pathname.split('/').filter(Boolean);
      var base = /\.github\.io$/.test(location.hostname) && partes.length ? '/' + partes[0] + '/' : '/';
      if (location.pathname.replace(/\/?$/, '/') === base) base = '/'; // evita recarregar a mesma página
      document.getElementById('inicio').href = base;
      setTimeout(function () { location.replace(base); }, 6000);
    })();
  </script>
</body>
</html>
