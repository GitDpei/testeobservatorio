<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | Observatório Municipal de Porto Velho</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #1c2244; text-align: center;
      background: radial-gradient(90vmax 70vmax at 12% -10%, #ffffff, transparent 62%),
                  linear-gradient(160deg, #f2f5fb 0%, #e9edf4 55%, #dfe5f0 100%);
    }
    main { max-width: 460px; }
    h1 { font-size: 26px; margin: 12px 0 8px; }
    p { color: #4a5273; line-height: 1.6; }
    .codigo { font-size: 84px; font-weight: 800; letter-spacing: -.04em; margin: 0; line-height: 1; }
    a { display: inline-block; margin-top: 16px; padding: 14px 24px; border-radius: 999px; background: #f0a02a; color: #24190a; font-weight: 700; text-decoration: none; box-shadow: 8px 8px 20px rgba(184,120,20,.28), -5px -5px 14px rgba(255,255,255,.9); }
    a:focus-visible { outline: 2px solid #8a5306; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="codigo" aria-hidden="true">404</p>
    <h1>Página não encontrada</h1>
    <p>Este endereço não existe no Observatório. Você será levado à página inicial em alguns segundos.</p>
    <a id="inicio" href="/">Ir para a página inicial</a>
  </main>
  <script>
    // Em sites de projeto do GitHub Pages (usuario.github.io/repositorio/), a raiz é a 1ª pasta.
    (function () {
      var partes = location.pathname.split('/').filter(Boolean);
      var base = /\.github\.io$/.test(location.hostname) && partes.length ? '/' + partes[0] + '/' : '/';
      if (location.pathname.replace(/\/?$/, '/') === base) base = '/'; // evita recarregar a mesma página
      document.getElementById('inicio').href = base;
      setTimeout(function () { location.replace(base); }, 6000);
    })();
  </script>
</body>
</html>
